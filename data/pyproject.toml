[project]
name = "scout-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felipe Fagundes", email = "felipemarostega.ff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.54.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg>=3.3.9",
    "pyarrow>=26.0.1",
]

[project.scripts]
scout-data = "scout_data:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
